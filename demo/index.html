<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>replikateur demo</title>
    <style>
      body {
        margin: 0;
        background: #0d0d0d;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }

      /* The terminal takes what is left, the panel has a fixed column. */
      .layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        height: 100vh;
      }

      .terminalPane {
        overflow: auto;
      }

      .panel {
        overflow-y: auto;
        padding: 20px;
        background: #161616;
        border-left: 1px solid #333;
        font-size: 13px;
      }

      .panel h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }

      .panel h2 {
        font-size: 13px;
        margin: 24px 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #999;
      }

      .panel p {
        margin: 0 0 16px;
        color: #999;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }

      .field > span {
        font-family: monospace;
        color: #9fd;
      }

      .field input[type='checkbox'] {
        align-self: flex-start;
        width: 16px;
        height: 16px;
      }

      .field input,
      .field select,
      .field textarea {
        background: #0d0d0d;
        color: inherit;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 4px 6px;
        font: inherit;
      }

      .rangeRow {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .rangeRow input {
        flex: 1;
        padding: 0;
      }

      .panel button {
        width: 100%;
        padding: 8px;
        background: #262626;
        color: inherit;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
      }

      .panel pre {
        background: #0d0d0d;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 8px;
        overflow-x: auto;
        font-size: 12px;
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
